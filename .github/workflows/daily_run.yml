name: Daily GitHub-Jira Sync

on:
  schedule:
    # Runs at 10:00 UTC every day (5 AM EST / 6 AM EDT)
    - cron: '0 10 * * *'
    # Runs at 17:00 UTC every day (12 PM EST / 1 PM EDT)
    - cron: '0 17 * * *'
    # Runs at 20:00 UTC every day (3 PM EST / 4 PM EDT)
    - cron: '0 20 * * *'
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:
    inputs:
      since_date:
        description: 'Date to sync issues since (MM-DD-YYYY or ISO format). Leave blank for default (2 days ago)'
        required: false
        default: ''
        type: string
      repo:
        description: 'Repository to sync. Choose "all" to sync every configured repo'
        required: false
        default: all
        type: choice
        options:
          - all
          - AI-infra-ui-components
          - chatbot
          - design-tokens
          - icons
          - mission-control-dashboard
          - patternfly
          - patternfly-a11y
          - ai-helpers
          - patternfly-cli
          - patternfly-design
          - patternfly-design-kit
          - patternfly-doc-core
          - patternfly-elements
          - patternfly-extension-seed
          - patternfly-infra-issues
          - patternfly-mcp
          - patternfly-org
          - patternfly-quickstarts
          - patternfly-react
          - patternfly-react-seed
          - pf-codemods
          - pf-roadmap
          - react-catalog-view
          - react-component-groups
          - react-console
          - react-data-view
          - react-log-viewer
          - react-topology
          - react-user-feedback
          - react-virtualized-extension
          - .github
          - github-jira-sync
          - jira-weekly-report
          - patternfly-analytics
          - red-hat-design-system
          - red-hat-design-tokens
          - red-hat-icons

# One sync at a time. A long manual run (e.g. a backfill of one repo) must not overlap a scheduled
# run, which could create the same Jira issues twice. A later run waits for the earlier one to finish.
concurrency:
  group: github-jira-sync
  cancel-in-progress: false

jobs:
  sync-github-jira:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run GitHub-Jira sync
      - name: Execute GitHub-Jira Sync
        env:
          # PF-org token
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # RH-UXD org token
          GH_JIRA_SYNC_RHUXD_PAT: ${{ secrets.GH_JIRA_SYNC_RHUXD_PAT }}
          # RedHat-UX org token (RHDS repos — patternfly-jira-sync bot)
          GH_JIRA_SYNC_RHDS_PAT: ${{ secrets.GH_JIRA_SYNC_RHDS_PAT }}
          # Jira Cloud Basic auth (email + API token)
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Manual-run inputs (empty on scheduled runs). Passed through env, not interpolated into the script.
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          SYNC_REPO: ${{ github.event.inputs.repo }}
        run: |
          args=()
          if [[ -n "$SINCE_DATE" ]]; then
            echo "Running sync with custom date: $SINCE_DATE"
            args+=(--since "$SINCE_DATE")
          else
            echo "Running sync with default date (2 days ago)"
          fi
          if [[ -n "$SYNC_REPO" && "$SYNC_REPO" != "all" ]]; then
            echo "Running sync for repo: $SYNC_REPO"
            args+=(--repo "$SYNC_REPO")
          fi
          node src/index.js "${args[@]}"
